<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Engineering Grid -->
  <g stroke="#1F293D" stroke-width="1" opacity="0.6">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>

    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Camera HUD Viewport -->
  <rect x="140" y="60" width="520" height="360" rx="16" fill="#0A101D" stroke="#263449" stroke-width="2"/>
  <circle cx="400" cy="240" r="130" fill="url(#radarGlow)"/>

  <!-- Face Detection Bounding Box -->
  <rect x="290" y="120" width="220" height="240" rx="12" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Reticle Corners -->
  <path d="M 280 140 L 280 110 L 310 110" fill="none" stroke="#3B82F6" stroke-width="3"/>
  <path d="M 520 110 L 490 110 L 520 140" fill="none" stroke="#3B82F6" stroke-width="3"/>
  <path d="M 280 340 L 280 370 L 310 370" fill="none" stroke="#3B82F6" stroke-width="3"/>
  <path d="M 520 370 L 490 370 L 520 340" fill="none" stroke="#3B82F6" stroke-width="3"/>

  <!-- Facial Landmark Mesh (Abstract) -->
  <ellipse cx="400" cy="220" rx="60" ry="75" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="375" cy="205" r="5" fill="#38BDF8"/>
  <circle cx="425" cy="205" r="5" fill="#38BDF8"/>
  <path d="M 370 205 Q 400 190 430 205" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
  <path d="M 390 245 Q 400 250 410 245" fill="none" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Gaze Indicator Vector -->
  <line x1="400" y1="205" x2="400" y2="175" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="400" cy="175" r="4" fill="#10B981"/>

  <!-- Top Status Badge -->
  <rect x="160" y="80" width="180" height="28" rx="6" fill="#151F32" stroke="#263449"/>
  <circle cx="175" cy="94" r="4" fill="#10B981"/>
  <text x="188" y="98" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">EXAMGUARD // ACTIVE</text>

  <!-- FPS & Model Tag -->
  <text x="635" y="98" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">YOLOv8 &bull; 60 FPS</text>

  <!-- Candidate ID -->
  <rect x="290" y="95" width="130" height="22" rx="4" fill="#1E293B"/>
  <text x="298" y="110" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">CANDIDATE: VERIFIED</text>

  <!-- Telemetry Bar Bottom -->
  <rect x="140" y="380" width="520" height="40" rx="0 0 16 16" fill="#111827" stroke="#263449"/>
  <text x="160" y="405" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">GAZE: NORMAL (0.4°)</text>
  <text x="360" y="405" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">FACES: 1</text>
  <text x="460" y="405" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">INTEGRITY: 99.8%</text>
</svg>

